[package]
name = "bombolab-core"
version = "0.1.0"
edition = "2024"
description = "Core data model and kinematics for Bombolab"
license = "MIT"

[[bin]]
name = "dh-solve"
path = "src/bin/dh-solve.rs"

[[bin]]
name = "quaternion-solve"
path = "src/bin/quaternion-solve.rs"

[[bin]]
name = "dynamics-report"
path = "src/bin/dynamics-report.rs"

[[bin]]
name = "singularity-report"
path = "src/bin/singularity-report.rs"

[[bin]]
name = "test-case-report"
path = "src/bin/test-case-report.rs"

[[bin]]
name = "workspace-report"
path = "src/bin/workspace-report.rs"

[dependencies]
nalgebra = "0.35.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "bombolab-core"
version = "0.1.0"
edition = "2024"
description = "Core data model and kinematics for Bombolab"
license = "MIT"

[[bin]]
name = "dh-solve"
path = "src/bin/dh-solve.rs"

[[bin]]
name = "quaternion-solve"
path = "src/bin/quaternion-solve.rs"

[[bin]]
name = "serial-test"
path = "src/bin/serial-test.rs"

[[bin]]
name = "ws-bridge"
path = "src/bin/ws-bridge.rs"
required-features = ["ws-bridge"]

[dependencies]
nalgebra = "0.35.0"
serialport = "4"
ctrlc = "3"
futures-util = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.24", optional = true }

[features]
ws-bridge = ["futures-util", "serde", "serde_json", "tokio", "tokio-tungstenite"]

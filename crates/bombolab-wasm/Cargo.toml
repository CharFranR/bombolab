[package]
name = "bombolab-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for Bombolab kinematics"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
bombolab-core = { path = "../bombolab-core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
nalgebra = "0.35.0"

[profile.release]
opt-level = "s"
lto = true
